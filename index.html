<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .app {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
    font-size: 28px;
    font-weight: bold;
    animation: luckyPulse 2.5s ease-in-out infinite;
    transform-origin: center;
}

@keyframes luckyPulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

        .info-btn {
            border: none;
            background: #111;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .tagline {
            color: #666;
            margin-top: -15px;
            margin-bottom: 25px;
        }

        .chat-box {
            min-height: 350px;
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .welcome {
            text-align: center;
            color: #777;
            padding: 80px 10px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 15px;
            margin: 10px 0;
            max-width: 85%;
        }

        .user-message {
            background: #111;
            color: white;
            margin-left: auto;
        }

        .lucky-message {
            background: #eee;
            color: #111;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        #message:focus {
            border-color: #111;
        }

        .send-btn {
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .send-btn:active,
        .info-btn:active {
            transform: scale(0.96);
        }

        /* Info window */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 20px;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .feature {
            margin: 12px 0;
        }

        .close-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            margin-top: 15px;
        }

        @media (max-width: 650px) {
            .app {
                margin: 10px auto;
            }
        }
/* MENU BUTTON */
.menu-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1001;
    background: #111;
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 24px;
    cursor: pointer;
}

/* SIDE MENU */
.side-menu {
    position: fixed;
    top: 0;
    left: -280px;
    width: 250px;
    height: 100vh;
    background: white;
    box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
    padding: 80px 15px 20px;
    z-index: 1000;
    transition: left 0.3s ease;
}

/* OPEN MENU */
.side-menu.open {
    left: 0;
}

/* MENU TITLE */
.side-menu h2 {
    margin-bottom: 25px;
}

/* MENU BUTTONS */
.side-menu button {
    display: block;
    width: 100%;
    padding: 15px;
    margin-bottom: 10px;
    border: none;
    border-radius: 10px;
    background: #f1f1f1;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.side-menu button:hover {
    background: #e5e5e5;
}
        
    </style>
</head>

<body>

<button class="menu-button" onclick="toggleMenu()">☰</button>

<div id="sideMenu" class="side-menu">
    <h2>LUCKY</h2>

    <button onclick="showChat()">💬 Chat</button>
    <button onclick="showCalculator()">🧮 Calculator</button>
    <button onclick="showTime()">🕐 Time</button>
    <button onclick="showDate()">📅 Date</button>
    <button onclick="openAbout()">ℹ️ About</button>
</div>
    
    <div class="app">

        <div class="header">
            <div class="logo">LUCKY</div>

            <button class="info-btn" onclick="openInfo()">
                ⓘ
            </button>
        </div>

        <p class="tagline">Your mini web assistant 🤖</p>

        <div class="chat-box" id="chatBox">
            <div class="welcome">
                <h2>Hey! 👋</h2>
                <p>I'm Lucky. Send me a message to get started.</p>
            </div>
        </div>

        <div class="input-area">
            <input
                id="message"
                type="text"
                placeholder="Ask Lucky something..."
            >

            <button class="send-btn" onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

    <!-- INFO MENU -->

    <div class="modal" id="infoModal">

        <div class="modal-content">

            <h2>About Lucky 🤖</h2>

            <p>
                Lucky is a mini assistant built with HTML, CSS and JavaScript.
            </p>

            <div class="feature">💬 Chat with Lucky</div>
            <div class="feature">👋 Respond to greetings</div>
            <div class="feature">🧮 Solve calculations</div>
            <div class="feature">❓ Answer supported questions</div>

            <p>
                More abilities are coming soon. 🚀
            </p>

            <button class="close-btn" onclick="closeInfo()">
                Close
            </button>

        </div>

    </div>

    <script>

function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    menu.classList.toggle("open");
}

function closeMenu() {
    const menu = document.getElementById("sideMenu");
    menu.classList.remove("open");
}

function showChat() {
    closeMenu();

    const calculator = document.getElementById("calculatorScreen");

    if (calculator) {
        calculator.style.display = "none";
    }

    document.querySelector(".app").style.display = "block";
}

function showCalculator() {
    closeMenu();

    const app = document.querySelector(".app");

    app.style.display = "none";

    let calculator = document.getElementById("calculatorScreen");

    if (!calculator) {
        calculator = document.createElement("div");

        calculator.id = "calculatorScreen";

        calculator.innerHTML = `
            <div style="
                max-width: 500px;
                margin: 30px auto;
                padding: 25px;
                background: white;
                border-radius: 20px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            ">

                <button onclick="showChat()" style="
                    border: none;
                    background: #111;
                    color: white;
                    padding: 10px 16px;
                    border-radius: 10px;
                    font-size: 16px;
                    cursor: pointer;
                ">
                    ← Back to Chat
                </button>

                <h1 style="margin-top: 25px;">
                    🧮 Calculator
                </h1>

                <input
                    id="calculatorDisplay"
                    type="text"
                    readonly
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 18px;
                        font-size: 24px;
                        margin: 15px 0;
                        border: 2px solid #ddd;
                        border-radius: 12px;
                        text-align: right;
                    "
                >

                <div style="
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 10px;
                ">

                    <button onclick="calculatorClear()">C</button>
                    <button onclick="calculatorInput('(')">(</button>
                    <button onclick="calculatorInput(')')">)</button>
                    <button onclick="calculatorInput('/')">÷</button>

                    <button onclick="calculatorInput('7')">7</button>
                    <button onclick="calculatorInput('8')">8</button>
                    <button onclick="calculatorInput('9')">9</button>
                    <button onclick="calculatorInput('*')">×</button>

                    <button onclick="calculatorInput('4')">4</button>
                    <button onclick="calculatorInput('5')">5</button>
                    <button onclick="calculatorInput('6')">6</button>
                    <button onclick="calculatorInput('-')">−</button>

                    <button onclick="calculatorInput('1')">1</button>
                    <button onclick="calculatorInput('2')">2</button>
                    <button onclick="calculatorInput('3')">3</button>
                    <button onclick="calculatorInput('+')">+</button>

                    <button onclick="calculatorInput('0')">0</button>
                    <button onclick="calculatorInput('.')">.</button>
                    <button onclick="calculatorBackspace()">⌫</button>
                    <button onclick="calculateResult()">=</button>

                </div>
            </div>
        `;

        document.body.insertBefore(calculator, app);

        const buttons = calculator.querySelectorAll("button:not([onclick='showChat()'])");

        buttons.forEach(button => {
            button.style.padding = "16px";
            button.style.fontSize = "20px";
            button.style.border = "none";
            button.style.borderRadius = "12px";
            button.style.background = "#f1f1f1";
            button.style.cursor = "pointer";
        });
    }

    calculator.style.display = "block";
}

let calculatorExpression = "";

function calculatorInput(value) {
    calculatorExpression += value;

    document.getElementById("calculatorDisplay").value =
        calculatorExpression;
}

function calculatorClear() {
    calculatorExpression = "";

    document.getElementById("calculatorDisplay").value = "";
}

function calculatorBackspace() {
    calculatorExpression = calculatorExpression.slice(0, -1);

    document.getElementById("calculatorDisplay").value =
        calculatorExpression;
}

function calculateResult() {
    if (!calculatorExpression) {
        return;
    }

    if (!/^[0-9+\-*/().\s]+$/.test(calculatorExpression)) {
        document.getElementById("calculatorDisplay").value = "Error";
        calculatorExpression = "";
        return;
    }

    try {
        const result = Function(
            '"use strict"; return (' + calculatorExpression + ')'
        )();

        if (Number.isFinite(result)) {
            calculatorExpression = String(result);

            document.getElementById("calculatorDisplay").value =
                calculatorExpression;
        } else {
            throw new Error();
        }

    } catch (error) {
        calculatorExpression = "";

        document.getElementById("calculatorDisplay").value =
            "Error";
    }
}
        
        let username = "Stanley";
        
        function chatbot(message) {

    message = message.toLowerCase().trim();

    if (message === "my name is stanley") {
        return "Nice to meet you, Stanley! 😎";
    }

    if (message === "what is my name" ||
        message === "what is my name?") {
        return "Your name is " + username + " 😎";
    }

    if (message === "hello" ||
        message === "hi" ||
        message === "hey") {
        return "Hey! 👋 How are you?";
    }

    if (message === "bye") {
        return "Goodbye! See you later. 👋";
    }

    if (message === "how are you") {
        return "I'm doing great! 😎";
    }
   
    if (
    message === "good" ||
    message === "fine" ||
    message === "great" ||
    message === "i'm good" ||
    message === "im good" ||
    message === "i am good" ||
    message === "i'm fine" ||
    message === "im fine" ||
    message === "i am fine"
) {
    return "That's great to hear, Stanley! 😎🔥 What are you up to?";
    }
            
    if (message === "what is your name" ||
        message === "who are you") {
        return "My name is Lucky. 🤖";
    }

    if (message === "thanks" ||
        message === "thank you") {
        return "You're welcome! 😎";
    }

    if (message === "what is the time" ||
        message === "what time is it" ||
        message === "time") {
        return "The current time is " + new Date().toLocaleTimeString();
    }

    if (message === "what is the date" ||
        message === "what is today's date" ||
        message === "date") {
        return "Today's date is " + new Date().toLocaleDateString();
    }

    const calculation = message
        .replace(/×/g, "*")
        .replace(/÷/g, "/");

    if (/^[0-9+\-*\/().\s]+$/.test(calculation)) {
        try {
            const result = Function(
                '"use strict"; return (' + calculation + ')'
            )();

            if (Number.isFinite(result)) {
                return "The answer is " + result + " 🧮";
            }
        } catch (error) {
            // Not a valid calculation
        }
    }
     // Extra conversations

if (message === "good morning") {
    return "Good morning, Stanley! ☀️";
}

if (message === "good night") {
    return "Good night, Stanley! 🌙";
}

if (message === "who made you" || message === "who created you") {
    return "I was created by Stanley! 🤖🔥";
}

if (message === "what can you do") {
    return "I can chat with you, answer simple questions, tell the time, give the date, and solve calculations! 😎";
}

if (message === "how old are you") {
    return "I'm still a young chatbot! 😂🤖";
}

if (message === "tell me a joke") {
    return "Why did the computer go to the doctor? Because it had a virus! 😂💻";
}

if (message === "what is your favorite color") {
    return "I'd say black. It matches my robot personality. 🖤🤖";
}
// Smarter conversations
if (message.includes("hello") || message.includes("hi") || message.includes("hey")) {
    return "Hey! 👋 I'm LUCKY. How can I help you?";
}

if (message.includes("how are you")) {
    return "I'm doing great! 🤖🔥 Thanks for asking. How about you?";
}

if (message.includes("your name") || message.includes("who are you")) {
    return "I'm LUCKY 🤖, your mini web assistant!";
}

if (message.includes("who made you") || message.includes("who created you")) {
    return "I was created by Stanley! 👨‍💻🔥";
}

if (message.includes("thank")) {
    return "You're welcome, Stanley! 😎🤝";
}

if (message.includes("good morning")) {
    return "Good morning, Stanley! ☀️ Hope you're having a great day!";
}

if (message.includes("good night")) {
    return "Good night, Stanley! 🌙 Sleep well!";
}

if (message.includes("what can you do")) {
    return "I can chat with you, tell the time and date, do calculations, and answer simple questions. 🤖";
}
    
    return "Sorry, I don't understand that yet. 🤔";
        } 


        function sendMessage() {

            const input = document.getElementById("message");
            const chatBox = document.getElementById("chatBox");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            const welcome = document.querySelector(".welcome");

            if (welcome) {
                welcome.remove();
            }

            const userMessage = document.createElement("div");

            userMessage.className = "message user-message";
            userMessage.textContent = message;

            chatBox.appendChild(userMessage);

            const reply = document.createElement("div");

            reply.className = "message lucky-message";
            reply.textContent = chatbot(message);

            chatBox.appendChild(reply);

            input.value = "";

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        function openInfo() {

            document.getElementById("infoModal").style.display = "flex";

        }


        function closeInfo() {

            document.getElementById("infoModal").style.display = "none";

        }


        document.getElementById("message").addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );
function showTime() {
    const now = new Date();
    alert(now.toLocaleTimeString());
}
function showDate() {
    const today = new Date();
    alert(today.toLocaleDateString());
}
  function openAbout() {
    alert("LUCKY\n\nYour mini web assistant.\nBuilt by Stanley.\nVersion 1.0");
  }        
     </script>

</body>
</html>
